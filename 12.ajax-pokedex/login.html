<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-sm">

            </div>
            <div class="col-sm">
                <div style="text-align: center;">
                    <h1>Login</h1>
                </div>
                
            
                <br>
                <p>Email:</p>
                <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu email:">
            
                <br>
                <p>Senha:</p>
                <input type="password" name="senha" id="senha" class="form-control" placeholder="Digite sua senha:">

                <br>
                <button onclick="login()" class="btn btn-success btn-lg">Logar</button>
            
                <br>
                <p class="mt-2">Voltar a home</p>
                <a href="index.html">Home</a>
            </div>

            <div class="col-sm"></div>

            <div id="pagina-protegida" class="container">

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

            if (localStorage.getItem('acess_token')) {
                const container = document.getElementById('pagina-protegida');

                const ancora = document.createElement('a');
                ancora.textContent = 'Pokedex';
                ancora.href = 'pokedex.html';

                container.appendChild(ancora);
            }

        
        function login(){
            let email = document.getElementById('email').value
            let senha = document.getElementById('senha').value


            $.ajax({
                url: `http://127.0.0.1:5000/login?email=${email}&senha=${senha}`,
                method: 'POST',
                success: function (resposta) {
                    localStorage.setItem('acess_token', resposta)
                    console.log(resposta)
                },
                error: function (erro) {
                    console.log(erro.responseJSON || erro)
                }
            })
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
