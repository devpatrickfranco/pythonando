{% extends 'base.html' %}

{% block 'titulo' %} Login {% endblock %}

{% block 'conteudo' %}
<div class="container">
    <br>

    {% if messages %}
        {%for  i in messages%}
            <div class="alert alert-{{i.tags}}">
                {{i}}
            </div>
        {%endfor%}
    {% endif %}

    <div class="row">
        <div class="col-md-3">
            
        </div>
        <div class="col-md flex-column">
            <h1>Logar</h1>
            <hr>
            <form method="POST" action="{% url 'valida_login' %}"> 
                {% csrf_token %}    
            
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="nome" class="form-control" name="nome" id="nome" placeholder="Digite seu nome:">
                </div>
            
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha: </label>
                    <input type="password" class="form-control" name="senha" id="senha" placeholder="Digite sua senha: ">
                </div>
            
                <input class="btn btn-success btn-lg" type="submit" value="Enviar">
                <a class="btn btn-primary btn-lg text-light" href="{% url 'cadastro' %}">Cdastre-se</a>
            </form>
        </div>
        <div class="col-md-3">
            
        </div>
    </div>
</div>
    
{% endblock %}
